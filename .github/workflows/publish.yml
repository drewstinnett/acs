name: Publish ACS Archive to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      search_query:
        description: 'Internet Archive search query'
        default: 'african repository colonial journal'
        required: false
        type: string
      item_limit:
        description: 'Maximum number of IA items to process'
        default: '100'
        required: false
        type: string
      ocr_workers:
        description: 'Number of parallel OCR workers'
        default: '2'
        required: false
        type: string

# Required for GitHub Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

# Only one deployment at a time
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install OCR and image tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr imagemagick

      # Restore cached database so we don't re-download/re-OCR unchanged pages.
      - name: Restore ACS database cache
        uses: actions/cache/restore@v4
        id: cache-restore
        with:
          path: ~/.acs
          key: acs-db-v1-${{ github.run_id }}
          restore-keys: |
            acs-db-v1-

      - name: Build acs tool
        run: go build -o acs .

      - name: Discover items on Internet Archive
        run: |
          ./acs search "${{ inputs.search_query }}" \
            --save \
            --limit "${{ inputs.item_limit }}"

      - name: Download microfilm images
        run: ./acs download --workers 2

      - name: Run OCR
        run: ./acs ocr --workers "${{ inputs.ocr_workers }}"

      # Save updated database for the next run.
      - name: Save ACS database cache
        uses: actions/cache/save@v4
        with:
          path: ~/.acs
          key: acs-db-v1-${{ github.run_id }}

      - name: Export static site
        run: ./acs export --out-dir ./public

      - name: Build pagefind search index
        run: npx --yes pagefind --site public

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
