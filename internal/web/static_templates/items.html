{{define "items-body"}}
<h2>All Items</h2>
{{if .Items}}
<table class="items-table">
  <thead>
    <tr>
      <th>Title</th>
      <th>Date</th>
      <th>Pages</th>
      <th>OCR&rsquo;d</th>
    </tr>
  </thead>
  <tbody>
  {{range .Items}}
  <tr>
    <td><a href="/items/{{.ID}}/">{{if .Title}}{{.Title}}{{else}}{{.ID}}{{end}}</a></td>
    <td>{{.Date}}</td>
    <td>{{.PageCount}}</td>
    <td>{{.OCRPageCount}}</td>
  </tr>
  {{end}}
  </tbody>
</table>
{{else}}
<p class="empty-state">No items found.</p>
{{end}}
{{end}}
